<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | Collab-Nest</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="stars"></div>
    <div class="twinkling"></div>
    
    <div class="dashboard-container">
        <!-- Sidebar Navigation (same as index.html) -->
        <aside class="sidebar">
            <!-- Copy the sidebar from index.html -->
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h2>Tasks</h2>
                <div class="header-actions">
                    <div class="filter-tabs">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="todo">To Do</button>
                        <button class="filter-btn" data-filter="in-progress">In Progress</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                    <button class="btn primary-btn" id="new-task-btn">
                        <i class="fas fa-plus"></i> New Task
                    </button>
                </div>
            </header>
            
            <!-- Tasks List -->
            <div class="tasks-container" id="tasks-list">
                <!-- Tasks will be loaded here via JavaScript -->
            </div>
            
            <div class="modal" id="new-task-modal">
                <div class="modal-content">
                  <span class="close-modal">&times;</span>
                  <h2>Create New Task</h2>
                  <form id="task-form">
                    <div class="form-group">
                      <label for="task-title">Task Title</label>
                      <input type="text" id="task-title" required>
                    </div>
                    <div class="form-group">
                      <label for="task-description">Description</label>
                      <textarea id="task-description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                      <label for="task-project">Project</label>
                      <select id="task-project" required>
                        <option value="">Loading projects...</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label for="task-due-date">Due Date</label>
                      <input type="date" id="task-due-date">
                    </div>
                    <button type="submit" class="btn primary-btn">Create Task</button>
                  </form>
                </div>
              </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
